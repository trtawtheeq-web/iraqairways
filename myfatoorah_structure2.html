    function cardViewPay() {
        $('#InvoiceKey').val("05099220021638614972-8cf94184");
        $('#PaymentId').val("090921638614920410641492");
        if ($('#IsOpenInvoice').val() === "True") {
            $('#OpenInvoiceValue').val($('#InvoiceValue').val());
        }

        let formData = {};
        if ($(".token-View").hasClass("active-form")) {
            if (!tokenForm.validate()) return;

            formData.TokenId = $('#TokenId').val();
            formData.CardBinNumber = getSelectedCardBin();
            formData.SecurityCode = tokenForm.cardModel.securitycode;
        } else {
            if (!paymentForm.validate()) return;

            if (isClickToPayEnabled && clickToPayCheckout && clickToPayBrands.toLowerCase().includes(selectedCardBrand))
            {
                SubmitC2PCard();
                return;
            }
            formData.HolderName = paymentForm.cardModel.CardHolderName;
            formData.Number = paymentForm.cardModel.Number;
            formData.ExpiryYear = paymentForm.cardModel.ExpiryYear;
            formData.ExpiryMonth = paymentForm.cardModel.ExpiryMonth;
            formData.SecurityCode = paymentForm.cardModel.SecurityCode;
            formData.TokenId = 0;
            formData.CardBinNumber = '';
            formData.IsSaveCard = $('#isSaveCard').is(":checked");
        }

        formData.__RequestVerificationToken = $("[name=__RequestVerificationToken]").val();
        formData.InvoiceKey = $('#InvoiceKey').val();
        formData.PaymentId = $('#PaymentId').val();
        if ($('#IsOpenInvoice').val() === "True") {
            formData.OpenInvoiceValue = $('#OpenInvoiceValue').val();
        }
        formData.CurrencyId = $("#CurrencyId").val();

        document.getElementById("overlay").style.display = "block";

        $.ajax({
            type: "POST",
            url: '/En/KWT/PayInvoice/CardViewPayment',
            data: formData,
            success: function(response) {
                off();
                var threeDsModal = document.getElementById('3dsModal');
                if (threeDsModal && is3DSAuthUrl(response.url)) {
                    var iframe = document.getElementById('iframe3DS');
                    iframe.src = response.url;
                    threeDsModal.style.display = 'block';
                    window.onclick = function (event) {
                        if (event.target === threeDsModal)
                            event.stopPropagation();
                    };
                    document.addEventListener('keydown', function (event) {
                        if (event.key === 'Escape')
                            event.preventDefault();
                    });
                }
                else
                    window.location = response.url;
            },
            error: function (xhr, status, error) {
                console.error("Payment failed:", error);
            },
            complete: function() {
                off();
            }
        });
    }

        function is3DSAuthUrl(url) {
            if (!url) return false;

            url = url.toLowerCase();
            const authUrls = [
                'mpgsauthentication',
                'checkoutgatewayauthentication',
                'cybersourceauthentication',
                'ngeniusauthentication',
            ];

            return authUrls.some(u => url.includes(u))
        }

    window.addEventListener("message", function (event) {
        try {
            var response = JSON.parse(event.data);
            if (response && response.sender == 'MF-3DSecure') {
                handlePostMessage(response.url);
            }
        }
        catch {
        }
    }, false);
    function handlePostMessage(url) {
        if (window.top === window.self)
            window.location.href = url;
        else
            window.parent.postMessage(JSON.stringify({ url: url, sender: 'MF-3DSecure' }), '*');
    }

    function off() {
        document.getElementById("overlay").style.display = "none";

        function currencyFormat(number, decimalDigitNumbers) {
            if (!decimalDigitNumbers) decimalDigitNumbers = 3;
            var value = number.toLocaleString('en-US', { minimumFractionDigits: decimalDigitNumbers, maximumFractionDigits: decimalDigitNumbers });
            return value;
        }

        function addCommas(nStr) {

            decimalDigitNumbers = '3';
            var formatedValue = currencyFormat(nStr, decimalDigitNumbers);
            return formatedValue;
        }

        function roundCeiling(num, scale) {
            if (!("" + num).includes("e")) {
                return +(Math.ceil(num + "e+" + scale) + "e-" + scale);
            } else {
                var arr = ("" + num).split("e");
                var sig = ""
                if (+arr[1] + scale > 0) {
                    sig = "+";
                }
                return +(Math.ceil(+arr[0] + "e" + sig + (+arr[1] + scale)) + "e-" + scale);
            }
        }

        function calculatePayNowButtonValue() {
            var cardType = cardChecker.cardType;
            if ($(".token-View").hasClass("active-form")) {
                cardType = getSelectedCardBrand();
                switch (cardType) {
                    case 'md': cardType = 'mada'; break;
                    case 'ae': cardType = 'amex'; break;
                    case 'v': cardType = 'visa'; break;
                    case 'm': cardType = 'master'; break;
                    default: $(".cardViewAmount").text(""); return;
                }
            }
            else {
                if (!$("#cardnumber").val())
                    return;
                if ($("#cardnumber").val().length < 7) {
                    $(".cardViewAmount").text("");
                    return;
                }
            }

            var paymentGateway = {};
            var cardViewPaymentGateways = [{"PaymentGatwayId":199,"Code":"vm","Name":"VISA/MASTER","ActionUrl":"ngenius","PercentageCommission":0,"FixedCommission":0,"TotalComission":0,"MaxCommission":0,"CurrencyId":1,"CurrencyName":"KD","ExchangeRate":1.00000000,"IsoCurrencyCodeAlpha":"KWD","Network":null}];

            var countryIsoCode = "KWT";
            var currencyIsoCode = "KWD";
            switch (cardType) {
                case 'mada':

                    break;
                case 'amex':
                    paymentGateway = cardViewPaymentGateways.find(a => a.Code == "ae" && a.CurrencyId == currencyId) ??
                        cardViewPaymentGateways.find(a => a.Code == "ae" && a.IsoCurrencyCodeAlpha.toLowerCase() == currencyIsoCode.toLowerCase()) ??
                        cardViewPaymentGateways.find(a => a.Code == "ae");
                    break;
                case 'visa':
                case 'master':
                    paymentGateway = cardViewPaymentGateways.find(a => (a.Code == "vm" || a.Code == "uaecc") && a.CurrencyId == currencyId) ??
                        cardViewPaymentGateways.find(a => (a.Code == "vm" || a.Code == "uaecc") && a.IsoCurrencyCodeAlpha.toLowerCase() == currencyIsoCode.toLowerCase()) ??
                        cardViewPaymentGateways.find(a => a.Code == "vm" || a.Code == "uaecc");
                    break;
                default:
            }

            var displayInvoiceValue = "78.800";

            if ($('#IsOpenInvoice').val() == "True")
                displayInvoiceValue = $(".invoice-value").val();

            var dueValue = cardViewAmount = 0;
            if (paymentGateway.CurrencyName == "KD") {
                dueValue = roundCeiling(parseFloat(displayInvoiceValue) + parseFloat(paymentGateway.TotalComission * paymentGateway.ExchangeRate), 2);
                cardViewAmount = addCommas(dueValue);
            }
            else {
                dueValue  = roundCeiling(parseFloat(paymentGateway.TotalComission + parseFloat($('#InvoiceValue').val())), 2);
                cardViewAmount = addCommas(roundCeiling(parseFloat(dueValue) * parseFloat(paymentGateway.ExchangeRate), 2));
            }

            $(".cardViewAmount")[0].innerHTML = " (<span class='mf-currency-icon' data-currency='" + paymentGateway.CurrencyName + "'>" + cardViewAmount + " </span>)";
        }


        if (0 === 1) {
            showWalletProvider("");
        }
    });
    if (performance.navigation.type == 2) {
        location.reload(true);
    }

    function cancelInvoice(cancelUrl) {
        if (typeof cancelUrl === "string" && cancelUrl.trim().length > 0)
            window.location.href = cancelUrl;
    }

    function selectPayment(element) {
        const paymentOptions = document.getElementById('PaymentOptions');
        const otherOptions = document.getElementById('otherOptions');
        const walletPayment = document.getElementById('WalletOptions');
        const payNowApple = document.getElementById('applePayContainer');
        const payNowGoogle = document.getElementById('googlePayContainer');
        const payNowSamsung = document.getElementById('samsungPayContainer');
        const payNowSTC = document.getElementById('stcContainer');

        paymentOptions.classList.add('hidden');
        otherOptions.style.display = 'block';

        switch (element.dataset.method) {
            case 'apple':
                if (payNowApple) payNowApple.classList.remove('hidden-method');
                break;
            case 'google':
                if (payNowGoogle) payNowGoogle.classList.remove('hidden-method');
                break;
            case 'samsung':
                if (payNowSamsung) payNowSamsung.classList.remove('hidden-method');
                break;
            case 'stc':
                if (payNowSTC) {
                    payNowSTC.classList.remove('hidden-method');
                    payNowSTC.classList.add('mf-payment-btns-container');
                }
                break;
        }
        walletPayment.classList.remove('hidden');
    }

    function resetSelection() {
        const paymentOptions = document.getElementById('PaymentOptions');
        const otherOptions = document.getElementById('otherOptions');
        const walletPayment = document.getElementById('WalletOptions');
        const payNowApple = document.getElementById('applePayContainer');
        const payNowGoogle = document.getElementById('googlePayContainer');
        const payNowSamsung = document.getElementById('samsungPayContainer');
        const payNowSTC = document.getElementById('stcContainer');

        walletPayment.classList.add('hidden');
        paymentOptions.classList.remove('hidden');
        otherOptions.style.display = 'none';

        if (payNowApple) payNowApple.classList.add('hidden-method');
        if (payNowGoogle) payNowGoogle.classList.add('hidden-method');
        if (payNowSamsung) payNowSamsung.classList.add('hidden-method');
        if (payNowSTC) {
            payNowSTC.classList.add('hidden-method');
            payNowSTC.classList.remove('mf-payment-btns-container');
        }
    }

    function showWalletProvider(walletProviderId) {
        document.getElementById('WalletOptions').classList.remove('hidden');

        switch (walletProviderId) {
            case 'applePaySelection':
                const payNowApple = document.getElementById('applePayContainer');
                if (payNowApple) payNowApple.classList.remove('hidden-method');
                const apple = document.getElementById('applePaySelection');
                if (apple) apple.style.display = 'none';
                break;
            case 'googlePaySelection':
                const payNowGoogle = document.getElementById('googlePayContainer');
                if (payNowGoogle) payNowGoogle.classList.remove('hidden-method');
                const google = document.getElementById('googlePaySelection');
                if (google) google.style.display = 'none';
                break;
            case 'samsungPaySelection':
                const payNowSamsung = document.getElementById('samsungPayContainer');
                if (payNowSamsung) payNowSamsung.classList.remove('hidden-method');
                const samsung = document.getElementById('samsungPaySelection');
                if (samsung) samsung.style.display = 'none';
                break;
            case 'stcPaySelection':
                const payNowSTC = document.getElementById('stcContainer');
                if (payNowSTC) {
                    payNowSTC.classList.add('mf-payment-btns-container');
                    payNowSTC.classList.remove('hidden-method');
                }
                const STC = document.getElementById('stcPaySelection');
                if (STC) STC.style.display = 'none';
                break;
        }
    }
    </script>
