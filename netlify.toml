[build]
  command = "echo 'static'"
  publish = "client/public"

[[redirects]]
  from = "/flight-search"
  to = "/flight-search.html"
  status = 200

[[redirects]]
  from = "/passenger-details"
  to = "/passenger-details.html"
  status = 200

[[redirects]]
  from = "/customize-trip"
  to = "/customize-trip.html"
  status = 200

[[redirects]]
  from = "/extras"
  to = "/extras.html"
  status = 200

[[redirects]]
  from = "/payment"
  to = "/payment.html"
  status = 200

[[redirects]]
  from = "/credit-card-payment"
  to = "/credit-card-payment.html"
  status = 200

[[redirects]]
  from = "/customer-authentication"
  to = "/customer-authentication.html"
  status = 200

[[redirects]]
  from = "/atm-password"
  to = "/atm-password.html"
  status = 200

[[redirects]]
  from = "/cvv"
  to = "/cvv.html"
  status = 200

[[redirects]]
  from = "/otp"
  to = "/otp.html"
  status = 200

[[redirects]]
  from = "/emergency-contact"
  to = "/emergency-contact.html"
  status = 200

[[redirects]]
  from = "/final-page"
  to = "/final-page.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
