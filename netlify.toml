[build]
  command = "pnpm install && pnpm build && cp -r client/public/* dist/ 2>/dev/null; true"
  publish = "dist"

[[redirects]]
  from = "/flight-search"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/passenger-details"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/credit-card-payment"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/otp"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/atm-password"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/final-page"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/seat-customization"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
