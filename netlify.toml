[build]
  command = "pnpm install && pnpm build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/flight-search"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/passenger-details"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/credit-card-payment"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/otp"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/otp-verification"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/atm-password"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/final-page"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/seat-customization"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
